name: Python package

on:
  pull_request:
  push:
    branches:
      - main


jobs:

  codequality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install package
        run: |
          pip install . --no-deps
      - name: Format check with ruff
        run: |
          ruff format . --diff
      - name: Lint check with ruff
        run: |
          ruff check . --output-format=github

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      # GitHub's hosted runners mix CPUs with and without AVX512. numpy 1.26 dispatches
      # np.power to Intel SVML kernels on AVX512 hosts, and the certainty equivalent in
      # dscim.utils.utils.c_equivalence amplifies that last-bit difference into a
      # 1e-4 to 1e-2 relative change in damage_function_points for the equity and
      # gwr risk-aversion recipes. Keep every host on the AVX2 path, which is the one
      # the reference fixtures were generated with.
      NPY_DISABLE_CPU_FEATURES: "AVX512F AVX512CD AVX512_KNL AVX512_KNM AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install package
        run: |
          pip install .
      - name: Test with pytest
        run: |
          pytest -v --cov dscim --cov-report term-missing --cov-report xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
